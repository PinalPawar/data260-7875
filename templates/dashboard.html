<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Grocery Recall Notices — Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">Grocery Recall Notices</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link active" href="/dashboard">Dashboard</a>
      <a class="nav-link" href="/logout">Logout</a>
    </div>
  </div>
</nav>

          <h3 class="card-title">Dashboard</h3>

          <a class="btn btn-outline-secondary" href="/notices">Manage recall notices</a>
          <a class="btn btn-danger ms-2" href="/logout">Logout</a>

      </div>
    </div>
  </div>

</html>
