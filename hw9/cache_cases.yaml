# HW9 Part 3.1 - labeled cache test set (Pinal Pawar, s7875). FROZEN before the threshold sweep:
# do not relabel after seeing results; labeling mistakes go in reports/hw09/LABEL_NOTES.md.
#
# seeds: the 10 questions put in the cache first (each answered once by the HW8 pipeline).
# cases: 40 incoming queries. expect = hit -> should be served by `seed`;
#        expect = miss -> no seed has the right answer (cached answer would be wrong).
# Facts in comments come from s7875_rel.notices.

seeds:
  S1:  "How many units of Butter batch 4609 were recalled?"                       # 3671 units
  S2:  "What is the reason for the Peanut Butter batch 4680 recall?"              # metal fragments
  S3:  "Which lot is affected by the Baby Formula batch 4622 recall?"             # lot #L14622
  S4:  "Who manufactures the Yogurt batch 4682 that was recalled?"                # Harvest Point
  S5:  "What should I do if I bought the recalled Frozen Spinach from GreenFields Co?"  # notice 5001, Listeria
  S6:  "What category is the Ice Cream batch 4602 recall?"                        # mislabelling
  S7:  "Is the Deli Turkey batch 4619 recall because of Listeria?"                # yes, bacterialContamination
  S8:  "How many units of Orange Juice batch 4606 are affected?"                  # 4914 units
  S9:  "What is the notice code for the Hummus batch 4618 recall?"                # RCL-2026-04618
  S10: "Which company recalled the Granola Bars batch 4612?"                      # Golden Acres

cases:
