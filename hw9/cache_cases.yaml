  - {id: E1,  type: exact, expect: hit, seed: S1,  text: "How many units of Butter batch 4609 were recalled?"}
  - {id: E2,  type: exact, expect: hit, seed: S2,  text: "What is the reason for the Peanut Butter batch 4680 recall?"}
