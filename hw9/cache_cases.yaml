  - {id: E6,  type: exact, expect: hit, seed: S6,  text: "What category is the Ice Cream batch 4602 recall?"}
  - {id: E7,  type: exact, expect: hit, seed: S7,  text: "Is the Deli Turkey batch 4619 recall because of Listeria?"}
  - {id: E8,  type: exact, expect: hit, seed: S8,  text: "How many units of Orange Juice batch 4606 are affected?"}
  - {id: E9,  type: exact, expect: hit, seed: S9,  text: "What is the notice code for the Hummus batch 4618 recall?"}
