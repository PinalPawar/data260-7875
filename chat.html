<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RecallHelper Chat</title>
<!-- HW6 Part 2: mini chat page. Served by FastAPI at /chat, calls POST /api/chat. -->
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --ink:#1f2933; --muted:#6b7280; --line:#e5e7eb;
          --user:#1d4ed8; --bot:#eef2f7; --accent:#0f766e; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line);
           display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  header h1 { font-size:17px; margin:0 12px 0 0; }
  header .who { color:var(--muted); font-size:13px; }
  header label { font-size:13px; color:var(--muted); }
  header input { font:inherit; font-size:13px; padding:4px 8px; border:1px solid var(--line); border-radius:6px; width:150px; }
  header button { font-size:13px; padding:5px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
  main { display:grid; grid-template-columns: minmax(0,1.3fr) minmax(0,1fr); gap:16px; padding:16px 20px; height:calc(100vh - 60px); }
  @media (max-width: 800px) { main { grid-template-columns:1fr; height:auto; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column; min-height:0; }
  #log { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; min-height:300px; }
  .msg { max-width:85%; padding:9px 12px; border-radius:12px; white-space:pre-wrap; }
  .msg.user { align-self:flex-end; background:var(--user); color:#fff; border-bottom-right-radius:3px; }
  .msg.assistant { align-self:flex-start; background:var(--bot); border-bottom-left-radius:3px; }
  .msg .meta { display:block; font-size:11px; opacity:.7; margin-top:4px; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  form input { flex:1; font:inherit; padding:9px 12px; border:1px solid var(--line); border-radius:8px; }
  form button { font:inherit; padding:9px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  form button:disabled { opacity:.5; cursor:wait; }
  #mem { padding:14px; overflow-y:auto; font-size:13px; }
  #mem h2 { font-size:14px; margin:0 0 10px; }
  #mem h3 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:14px 0 6px; }
  #mem pre { white-space:pre-wrap; margin:0; background:var(--bg); padding:8px; border-radius:6px; font-size:12px; }
  .fact { padding:4px 0; border-bottom:1px dashed var(--line); }
  .pill { display:inline-block; font-size:11px; padding:1px 6px; border-radius:10px; background:var(--bg); margin-left:4px; }
</style>
</head>
<body>
<header>
  <h1>RecallHelper</h1>
  <span class="who">Pinal Pawar &middot; s7875 &middot; HW6 Part 2</span>
  <label>user_id <input id="uid" value="pinal"></label>
  <label>session <input id="sid" placeholder="new on first message"></label>
  <button id="newsess" type="button">New session</button>
</header>
<main>
  <section class="card">
    <div id="log"></div>
    <form id="f">
      <input id="msg" autocomplete="off" placeholder="Type a message..." required>
      <button id="send">Send</button>
    </form>
  </section>
  <section class="card"><div id="mem"><h2>Memory used for the last turn</h2><p>Send a message to see it.</p></div></section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let turn = 0;

function add(role, text, meta) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.innerHTML = esc(text) + (meta ? `<span class="meta">${esc(meta)}</span>` : "");
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}

function showMemory(r) {
  const m = r.memory_used, w = r.memory_written;
  const facts = m.episodic_facts.length
    ? m.episodic_facts.map(f => `<div class="fact">${esc(f.fact)}<span class="pill">score ${f.score}</span><span class="pill">imp ${f.importance}</span></div>`).join("")
    : "<p>None retrieved.</p>";
  const fresh = w.new_episodic_facts.length
    ? w.new_episodic_facts.map(f => `<div class="fact">${esc(f.fact)}<span class="pill">imp ${f.importance}</span></div>`).join("")
    : "<p>None.</p>";
  $("mem").innerHTML = `
    <h2>Memory used for turn ${turn}</h2>
    <h3>Short-term window (${m.short_term.count} of max ${m.short_term.n_limit})</h3>
    <pre>${esc(m.short_term.messages.map(x => x.role + ": " + x.content).join("\n") || "(empty)")}</pre>
    <h3>Session summary</h3><pre>${esc(m.session_summary || "(none yet)")}</pre>
    <h3>Lifetime summary</h3><pre>${esc(m.lifetime_summary || "(none yet)")}</pre>
    <h3>Episodic facts retrieved</h3>${facts}
    <h3>Written this turn</h3>${fresh}
    <p>Session summary updated: <b>${w.session_summary_updated}</b> &middot; Lifetime summary updated: <b>${w.lifetime_summary_updated}</b></p>
    <h3>Usage</h3><pre>prompt tokens ${r.usage.prompt_tokens}, completion tokens ${r.usage.completion_tokens}, model ${r.usage.latency_ms} ms, request ${r.usage.total_request_ms} ms</pre>`;
}

$("newsess").onclick = () => { $("sid").value = ""; $("log").innerHTML = ""; turn = 0; };

$("f").onsubmit = async e => {
  e.preventDefault();
  const text = $("msg").value.trim();
  if (!text) return;
  add("user", text);
  $("msg").value = ""; $("send").disabled = true;
  try {
    const body = { user_id: $("uid").value.trim(), message: text };
    if ($("sid").value.trim()) body.session_id = $("sid").value.trim();
    const res = await fetch("/api/chat", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const r = await res.json();
    if (!res.ok) throw new Error(typeof r.detail === "string" ? r.detail : JSON.stringify(r.detail));
    turn += 1;
    $("sid").value = r.session_id;
    add("assistant", r.reply, `turn ${turn} · window ${r.memory_used.short_term.count} · facts ${r.memory_used.episodic_facts.length}`);
    showMemory(r);
  } catch (err) {
    add("assistant", "Error: " + err.message);
  } finally {
    $("send").disabled = false; $("msg").focus();
  }
};
</script>
</body>
</html>
